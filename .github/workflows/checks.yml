# Checks that run without R. They test the data, the documentation, the
# committed results and the syntax of the R and JavaScript files. They do NOT
# run the R code; see docs/TESTING.md and docs/ROADMAP.md.
name: Checks (no R)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Data audit (fails on structural defects)
        run: python3 tools/audit_data.py --check

      - name: Generated audit report is committed and current
        run: git diff --exit-code -- docs/DATA_AUDIT.md

      - name: Repository consistency (metadata, links, committed results)
        run: python3 tools/check_repo.py

      - name: Tests for the Python tools
        run: python3 -m unittest discover -s tests/python -v

      - name: R syntax (tree-sitter parse, does not run R)
        run: |
          npm ci --ignore-scripts --prefix tools/r-syntax
          node tools/r-syntax/check.js

      - name: JavaScript syntax
        run: for f in app/www/*.js tests/browser/*.js; do node --check "$f" || exit 1; done

      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.18.1

  # Runs the R code itself: the testthat suite and the app/map/report check
  # scripts (each prints [PASS]/[FAIL]; any [FAIL] fails the job). Added with
  # the product review; it has not run on GitHub yet (see docs/TESTING.md).
  r-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::bslib
            any::htmltools
            any::testthat
            any::withr
            any::xml2
            any::curl
            any::callr
            any::httpuv

      - name: Automated R tests (testthat)
        run: |
          Rscript -e 'res <- as.data.frame(testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = FALSE)); cat(sprintf("\n%d tests, %d expectations passed, %d failed, %d errors\n", nrow(res), sum(res$passed), sum(res$failed), sum(res$error))); if (sum(res$failed) + sum(res$error) > 0) quit(status = 1)'

      - name: Data, map, app and report check scripts
        run: |
          for s in 01_audit 07_map 08_app_check 09_report_check; do
            Rscript -e "source('analysis/$s.R')" | tee "/tmp/$s.log"
            if grep -q '\[FAIL\]' "/tmp/$s.log"; then echo "::error::$s has failing checks"; exit 1; fi
          done
